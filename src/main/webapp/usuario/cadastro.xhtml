<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:p="primefaces"
      xmlns:f="jakarta.faces.core">

    <body>

        <ui:composition template="./../index.xhtml">

            <ui:define name="content">
                <h:form>

                    <f:facet name="header">
                        Cadastrar usuario
                    </f:facet>

                    <p:panelGrid columns="2" layout="tabular">
                        <h:outputLabel value="Nome"/>
                        <p:inputText value="#{usuarioController.usuario.nome}"/>

                        <h:outputLabel value="Email"/>
                        <p:inputText value="#{usuarioController.usuario.email}"/>

                        <h:outputLabel value="Senha"/>
                        <p:password value="#{usuarioController.usuario.senha}"/>
                        
                        <h:outputLabel value="Nivel"/>
                        <p:selectOneMenu id="option" value="#{usuarioController.nivelSelecionado}">
                            <f:selectItem itemLabel="Selecione o nivel" itemValue=""/>
                            <f:selectItem itemLabel="Administrador" itemValue="ADMINISTRADOR"/>
                            <f:selectItem itemLabel="Usuario Comum" itemValue="COMUM"/>
                        </p:selectOneMenu>
                       
                    </p:panelGrid>
                    <p:commandButton action="#{usuarioController.adicionar()}" value="Cadastrar"/>
                </h:form>
            </ui:define>

        </ui:composition>

    </body>
</html>
